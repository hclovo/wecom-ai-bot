services:
  wecom-ai-bot:
    build: .
    image: wecom-ai-bot:latest
    container_name: wecom-ai-bot
    restart: unless-stopped
    ports:
      - "127.0.0.1:8788:8788"
    # 密钥与配置统一放 .env（同目录），不会打进镜像
    env_file: .env
    environment:
      PORT: "8788"
      SQLITE_PATH: /app/data/bot.sqlite
    volumes:
      - bot-data:/app/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  bot-data:
