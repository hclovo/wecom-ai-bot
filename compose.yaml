services:
  wecom-ai-bot:
    build: .
    image: wecom-ai-bot:latest
    container_name: wecom-ai-bot
    restart: unless-stopped
    ports:
      - "8788:8788"
    env_file: .env
    environment:
      PORT: "8788"
      CURSOR_STATE_DIR: /home/node/.cursor-agent-state
    volumes:
      - cursor-state:/home/node/.cursor-agent-state
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  cursor-state:
